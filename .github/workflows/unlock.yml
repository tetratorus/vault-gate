name: Unlock scope key

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope to unlock (default: screen-history)"
        required: true
        default: "screen-history"
        type: string
      id:
        description: "Response branch ID (res/<id>)"
        required: true
        type: string
      pubkey:
        description: "Ephemeral age public key (age1...)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  unlock:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'tetratorus'
    runs-on: ubuntu-latest
    environment: unlock
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Derive, wrap, and publish to res/<id>
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_ID: ${{ inputs.id }}
          IN_PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issues" ]]; then
            # Title format: "unlock-<id>" (defaults scope=screen-history) or "<scope>:<id>"
            if [[ "$ISSUE_TITLE" == *:* ]]; then
              SCOPE="${ISSUE_TITLE%%:*}"
              REQ_ID="${ISSUE_TITLE#*:}"
            else
              SCOPE="screen-history"
              REQ_ID="${ISSUE_TITLE#unlock-}"
            fi
            PUBKEY="$(printf '%s' "$ISSUE_BODY" | tr -d '[:space:]')"
          else
            SCOPE="$IN_SCOPE"
            REQ_ID="$IN_ID"
            PUBKEY="$(printf '%s' "$IN_PUBKEY" | tr -d '[:space:]')"
          fi

          if [[ ! "$PUBKEY" =~ ^age1[a-z0-9]{50,}$ ]]; then
            echo "Invalid age pubkey" >&2
            exit 1
          fi
          if [[ ! "$REQ_ID" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid request id" >&2
            exit 1
          fi

          python3 - "$MASTER_KEY" "$SCOPE" <<'PY' | age -a -r "$PUBKEY" -o scope.key.age
          import sys, hmac, hashlib
          CHARSET = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
          def polymod(values):
              gen = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3]
              chk = 1
              for v in values:
                  b = chk >> 25
                  chk = ((chk & 0x1ffffff) << 5) ^ v
                  for i in range(5):
                      chk ^= gen[i] if ((b >> i) & 1) else 0
              return chk
          def hrp_expand(hrp):
              return [ord(x) >> 5 for x in hrp] + [0] + [ord(x) & 31 for x in hrp]
          def convertbits(data, frombits, tobits):
              acc, bits, ret, maxv = 0, 0, [], (1 << tobits) - 1
              for v in data:
                  acc = (acc << frombits) | v
                  bits += frombits
                  while bits >= tobits:
                      bits -= tobits
                      ret.append((acc >> bits) & maxv)
              if bits:
                  ret.append((acc << (tobits - bits)) & maxv)
              return ret
          def bech32_encode(hrp, data):
              values = hrp_expand(hrp) + data
              pm = polymod(values + [0]*6) ^ 1
              chk = [(pm >> 5 * (5 - i)) & 31 for i in range(6)]
              return hrp + "1" + "".join(CHARSET[d] for d in data + chk)

          raw = hmac.new(sys.argv[1].encode("utf-8"), sys.argv[2].encode("utf-8"), hashlib.sha256).digest()
          print(bech32_encode("age-secret-key-", convertbits(raw, 8, 5)).upper())
          PY

          mkdir -p out && mv scope.key.age out/scope.key.age
          cd out
          git init -b "res/$REQ_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scope.key.age
          git commit -m "res"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/res/$REQ_ID"

          if [[ "$EVENT_NAME" == "issues" && -n "$ISSUE_NUM" ]]; then
            gh issue close "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" >/dev/null || true
          fi
